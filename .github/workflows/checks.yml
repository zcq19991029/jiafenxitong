name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/test-runtime
      - name: Check database and application behavior
        run: |
          node tools/test_backend.mjs
          node tools/test_passwords.mjs
          node tools/test_assessment.mjs
          node tools/test_online.mjs
          node tools/build_site.mjs
          node tools/test_site.mjs
